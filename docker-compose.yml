name: game-server

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: game_user
      POSTGRES_PASSWORD: game_password
      POSTGRES_DB: game_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game_user -d game_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  game-server:
    build: .
    ports:
      - "8080:8080"
    environment:
      GAME_DB_URL: postgres://game_user:game_password@db:5432/game_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: